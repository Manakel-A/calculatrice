<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculatrice Scientifique Pro</title>

<style>

/* ===== TON CSS INCHANGÉ ===== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#1e1e2f;
    font-family:Arial, sans-serif;
    transition:0.3s;
    padding:20px;
    overflow-y:auto;
}

body.clair{
    background:#f4f4f4;
}

.calculatrice{
    width:100%;
    max-width:430px;

    background:linear-gradient(
        145deg,
        #2c2c3e,
        #1a1a28
    );

    padding:20px;
    border-radius:20px;

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 0 25px rgba(0,0,0,0.4);

    transition:0.3s;

    max-height:95vh;
    overflow-y:auto;
}

/* ===== RESTE CSS IDENTIQUE ===== */

.ecran{
    width:100%;
    height:70px;
    margin-bottom:15px;
    font-size:30px;
    text-align:right;
    padding:15px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#111827;
    color:white;
    position:sticky;
    top:0;
    z-index:10;
}

/* ... tout ton CSS reste identique ... */

</style>
</head>

<body>

<div class="calculatrice">

    <button class="mode" onclick="changerMode()">
        Mode Clair / Sombre
    </button>

    <div class="status">
        <span class="point-vert"></span>
        Calculatrice Active
    </div>

    <input type="text" id="ecran" class="ecran" disabled>

    <!-- ⭐ NOUVEAUX BOUTONS CONVERTISSEUR SIMPLE -->
    <div class="boutons">

        <button class="science" onclick="kmToM()">km → m</button>
        <button class="science" onclick="mToKm()">m → km</button>
        <button class="science" onclick="cToF()">°C → °F</button>
        <button class="science" onclick="fToC()">°F → °C</button>

    </div>

    <!-- ===== TES BOUTONS EXISTANTS ===== -->
    <div class="boutons">

        <button onclick="ajouter('7')">7</button>
        <button onclick="ajouter('8')">8</button>
        <button onclick="ajouter('9')">9</button>
        <button onclick="ajouter('/')">÷</button>

        <button onclick="ajouter('4')">4</button>
        <button onclick="ajouter('5')">5</button>
        <button onclick="ajouter('6')">6</button>
        <button onclick="ajouter('*')">×</button>

        <button onclick="ajouter('1')">1</button>
        <button onclick="ajouter('2')">2</button>
        <button onclick="ajouter('3')">3</button>
        <button onclick="ajouter('-')">−</button>

        <button onclick="ajouter('0')">0</button>
        <button onclick="ajouter('.')">.</button>
        <button onclick="ajouter('+')">+</button>
        <button onclick="calculer()">=</button>

    </div>

</div>

<script>

let ecran = document.getElementById("ecran");

/* ===== TES FONCTIONS EXISTANTES INCHANGÉES ===== */

function ajouter(val){
    ecran.value += val;
}

function calculer(){
    try{
        ecran.value = eval(ecran.value);
    }catch{
        ecran.value = "Erreur";
    }
}

/* ===== ⭐ CONVERTISSEURS SIMPLES AJOUTÉS ===== */

function kmToM(){
    ecran.value = ecran.value * 1000;
}

function mToKm(){
    ecran.value = ecran.value / 1000;
}

function cToF(){
    ecran.value = (ecran.value * 1.8) + 32;
}

function fToC(){
    ecran.value = (ecran.value - 32) / 1.8;
}

function effacer(){
    ecran.value = "";
}

function supprimer(){
    ecran.value = ecran.value.slice(0, -1);
}

function changerMode(){
    document.body.classList.toggle("clair");
}

</script>

</body>
</html>
