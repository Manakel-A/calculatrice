<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculatrice</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#1e1e2f;
    font-family:Arial, sans-serif;
    transition:0.3s;
    padding:15px;
}

body.clair{
    background:#f4f4f4;
}

.calculatrice{
    width:100%;
    max-width:360px;
    background:#2c2c3e;
    padding:20px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    transition:0.3s;
}

body.clair .calculatrice{
    background:white;
}

.ecran{
    width:100%;
    height:70px;
    margin-bottom:15px;
    font-size:30px;
    text-align:right;
    padding:15px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#111827;
    color:white;
}

body.clair .ecran{
    background:#eeeeee;
    color:black;
}

.boutons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    padding:18px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}

button:active{
    transform:scale(0.95);
}

.operateur{
    background:#19c37d;
    color:white;
}

.equal{
    background:#00b894;
    color:white;
    grid-column:span 2;
}

.clear{
    background:#e63946;
    color:white;
}

.mode{
    width:100%;
    margin-bottom:15px;
    background:#6c5ce7;
    color:white;
}

.historique{
    margin-top:20px;
    background:#1e1e2f;
    padding:10px;
    border-radius:12px;
    max-height:150px;
    overflow-y:auto;
    color:white;
}

body.clair .historique{
    background:#eeeeee;
    color:black;
}

.historique h3{
    margin-top:0;
    text-align:center;
}

.ligne{
    padding:8px;
    border-bottom:1px solid #444;
    font-size:16px;
    word-break:break-word;
}

body.clair .ligne{
    border-bottom:1px solid #bbb;
}

@media(max-width:500px){

    button{
        padding:15px;
        font-size:18px;
    }

    .ecran{
        font-size:24px;
    }

}

</style>

</head>

<body>

<div class="calculatrice">

    <button class="mode" onclick="changerMode()">
        🌙 Mode Clair / Sombre
    </button>

    <input type="text" id="ecran" class="ecran" disabled>

    <div class="boutons">

        <button onclick="ajouter('7')">7</button>
        <button onclick="ajouter('8')">8</button>
        <button onclick="ajouter('9')">9</button>
        <button class="operateur" onclick="ajouter('/')">÷</button>

        <button onclick="ajouter('4')">4</button>
        <button onclick="ajouter('5')">5</button>
        <button onclick="ajouter('6')">6</button>
        <button class="operateur" onclick="ajouter('*')">×</button>

        <button onclick="ajouter('1')">1</button>
        <button onclick="ajouter('2')">2</button>
        <button onclick="ajouter('3')">3</button>
        <button class="operateur" onclick="ajouter('-')">−</button>

        <button onclick="ajouter('0')">0</button>
        <button onclick="ajouter('.')">.</button>
        <button class="operateur" onclick="ajouter('+')">+</button>
        <button onclick="supprimer()">⌫</button>

        <button class="clear" onclick="effacer()">C</button>
        <button class="equal" onclick="calculer()">=</button>

    </div>

    <div class="historique">

        <h3>Historique</h3>

        <div id="listeHistorique"></div>

    </div>

</div>

<script>

let ecran = document.getElementById("ecran");

let historique = document.getElementById("listeHistorique");

let operateurs = ["+", "-", "*", "/"];

function ajouter(val){

    let dernier = ecran.value.slice(-1);

    // empêcher deux opérateurs à la suite
    if(
        operateurs.includes(dernier) &&
        operateurs.includes(val)
    ){
        return;
    }

    // empêcher plusieurs points dans un nombre
    if(val == "."){

        let parties = ecran.value.split(/[\+\-\*\/]/);

        let dernierNombre = parties[parties.length - 1];

        if(dernierNombre.includes(".")){
            return;
        }

    }

    ecran.value += val;

}

function effacer(){

    ecran.value = "";

}

function supprimer(){

    ecran.value = ecran.value.slice(0, -1);

}

function calculer(){

    try{

        if(ecran.value == ""){
            return;
        }

        let expression = ecran.value;

        let resultat = eval(expression);

        // empêcher Infinity
        if(!isFinite(resultat)){
            throw Error();
        }

        resultat = Number(resultat.toFixed(8));

        ecran.value = resultat;

        ajouterHistorique(expression, resultat);

    }

    catch{

        ecran.value = "Erreur";

    }

}

function ajouterHistorique(expression, resultat){

    let ligne = document.createElement("div");

    ligne.classList.add("ligne");

    ligne.innerHTML = expression + " = " + resultat;

    historique.prepend(ligne);

}

function changerMode(){

    document.body.classList.toggle("clair");

}

document.addEventListener("keydown", function(event){

    let touche = event.key;

    if(
        (touche >= "0" && touche <= "9") ||
        operateurs.includes(touche) ||
        touche == "."
    ){

        ajouter(touche);

    }

    else if(touche == "Enter"){

        calculer();

    }

    else if(touche == "Backspace"){

        supprimer();

    }

    else if(touche == "Delete"){

        effacer();

    }

});

</script>

</body>
</html>
