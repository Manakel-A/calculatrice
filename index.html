<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculatrice Pro+</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#1e1e2f;
    display:flex;
    justify-content:center;
    padding:20px;
    color:white;
}

.calculatrice{
    width:100%;
    max-width:450px;
    background:#2c2c3e;
    padding:20px;
    border-radius:20px;
}

.ecran{
    width:100%;
    font-size:26px;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    border:none;
    text-align:right;
}

button{
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.op{background:#00c853;color:white;}
.eq{background:#00b894;color:white;}
.clear{background:#e74c3c;color:white;}
.sc{background:#f1c40f;color:black;}

.small{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
    font-size:14px;
}
</style>
</head>

<body>

<div class="calculatrice">

<input id="ecran" class="ecran" disabled>

<div class="small">
<button onclick="toggleAngle()">Mode: <span id="modeAngle">DEG</span></button>
<button onclick="clearAll()" class="clear">C</button>
</div>

<div class="grid">

<button onclick="ajouter('7')">7</button>
<button onclick="ajouter('8')">8</button>
<button onclick="ajouter('9')">9</button>
<button onclick="ajouter('/')">÷</button>

<button onclick="ajouter('4')">4</button>
<button onclick="ajouter('5')">5</button>
<button onclick="ajouter('6')">6</button>
<button onclick="ajouter('*')">×</button>

<button onclick="ajouter('1')">1</button>
<button onclick="ajouter('2')">2</button>
<button onclick="ajouter('3')">3</button>
<button onclick="ajouter('-')">−</button>

<button onclick="ajouter('0')">0</button>
<button onclick="ajouter('.')">.</button>
<button onclick="ajouter('+')">+</button>
<button onclick="backspace()">⌫</button>

<button onclick="ajouter('(')">(</button>
<button onclick="ajouter(')')">)</button>
<button onclick="ajouter('Math.PI')">π</button>
<button onclick="ajouter('Math.E')">e</button>

<button class="sc" onclick="sin()">sin</button>
<button class="sc" onclick="cos()">cos</button>
<button class="sc" onclick="tan()">tan</button>
<button class="eq" onclick="calculer()">=</button>

</div>

<h3>Historique</h3>
<div id="history"></div>

</div>

<script>

let ecran = document.getElementById("ecran");
let historyDiv = document.getElementById("history");

let history = JSON.parse(localStorage.getItem("calcHistory") || "[]");

let angleMode = "DEG";

function ajouter(v){
    ecran.value += v;
}

function backspace(){
    ecran.value = ecran.value.slice(0,-1);
}

function clearAll(){
    ecran.value = "";
}

function toggleAngle(){
    angleMode = angleMode === "DEG" ? "RAD" : "DEG";
    document.getElementById("modeAngle").innerText = angleMode;
}

/* ---------- SAFE EVAL ---------- */
function safeEval(expr){
    try{
        return Function("return " + expr)();
    }catch{
        return "Erreur";
    }
}

/* ---------- TRIGO ---------- */
function toRad(x){
    return angleMode === "DEG" ? x * Math.PI / 180 : x;
}

function sin(){
    ecran.value = Math.sin(toRad(Number(ecran.value)));
}
function cos(){
    ecran.value = Math.cos(toRad(Number(ecran.value)));
}
function tan(){
    ecran.value = Math.tan(toRad(Number(ecran.value)));
}

/* ---------- CALCUL ---------- */
function calculer(){

    let expr = ecran.value;

    let result = safeEval(expr);

    if(result === "Erreur"){
        ecran.value = "Erreur";
        return;
    }

    ecran.value = result;

    history.unshift({
        expression: expr,
        result: result,
        date: new Date().toLocaleTimeString()
    });

    localStorage.setItem("calcHistory", JSON.stringify(history));

    renderHistory();
}

/* ---------- HISTORIQUE ---------- */
function renderHistory(){
    historyDiv.innerHTML = "";

    history.forEach(h => {
        let div = document.createElement("div");
        div.style.padding = "5px";
        div.style.borderBottom = "1px solid #444";
        div.innerText = `${h.expression} = ${h.result}`;
        div.onclick = () => ecran.value = h.result;
        historyDiv.appendChild(div);
    });
}

renderHistory();

/* ---------- KEYBOARD ---------- */
document.addEventListener("keydown", (e)=>{

    if(!isNaN(e.key) || "+-*/().".includes(e.key)){
        ajouter(e.key);
    }

    if(e.key === "Enter"){
        calculer();
    }

    if(e.key === "Backspace"){
        backspace();
    }
});

</script>

</body>
</html>
