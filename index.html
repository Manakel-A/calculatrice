<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculatrice Scientifique Pro</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#1e1e2f;
    font-family:Arial, sans-serif;
    transition:0.3s;
    padding:15px;
}

body.clair{
    background:#f4f4f4;
}

.calculatrice{
    width:100%;
    max-width:430px;
    background:#2c2c3e;
    padding:20px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    transition:0.3s;
}

body.clair .calculatrice{
    background:white;
}

.ecran{
    width:100%;
    height:70px;
    margin-bottom:15px;
    font-size:30px;
    text-align:right;
    padding:15px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#111827;
    color:white;
}

body.clair .ecran{
    background:#eeeeee;
    color:black;
}

.boutons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

button{
    padding:15px;
    font-size:17px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}

button:active{
    transform:scale(0.95);
}

.operateur{
    background:#19c37d;
    color:white;
}

.equal{
    background:#00b894;
    color:white;
    grid-column:span 2;
}

.clear{
    background:#e63946;
    color:white;
}

.mode{
    width:100%;
    margin-bottom:15px;
    background:#6c5ce7;
    color:white;
}

.science{
    background:#fdcb6e;
    color:black;
}

.memoire{
    background:#0984e3;
    color:white;
}

.historique{
    margin-top:20px;
    background:#1e1e2f;
    padding:10px;
    border-radius:12px;
    max-height:180px;
    overflow-y:auto;
    color:white;
}

body.clair .historique{
    background:#eeeeee;
    color:black;
}

.historique h3{
    margin-top:0;
    text-align:center;
}

.ligne{
    padding:10px;
    border-bottom:1px solid #444;
    font-size:15px;
    word-break:break-word;
    cursor:pointer;
    transition:0.2s;
}

.ligne:hover{
    background:rgba(255,255,255,0.1);
}

body.clair .ligne{
    border-bottom:1px solid #bbb;
}

.infos{
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    color:white;
}

body.clair .infos{
    color:black;
}

@media(max-width:500px){

    button{
        padding:12px;
        font-size:15px;
    }

    .ecran{
        font-size:24px;
    }

}

</style>

</head>

<body>

<div class="calculatrice">

    <button class="mode" onclick="changerMode()">
        🌙 Mode Clair / Sombre
    </button>

    <input type="text" id="ecran" class="ecran" disabled>

    <div class="boutons">

        <!-- Scientifique -->
        <button class="science" onclick="sinus()">sin</button>
        <button class="science" onclick="cosinus()">cos</button>
        <button class="science" onclick="tangente()">tan</button>
        <button class="science" onclick="logarithme()">log</button>
        <button class="science" onclick="puissance()">x²</button>

        <!-- Mémoire -->
        <button class="memoire" onclick="memoirePlus()">M+</button>
        <button class="memoire" onclick="memoireMoins()">M-</button>
        <button class="memoire" onclick="memoireAfficher()">MR</button>
        <button class="memoire" onclick="memoireEffacer()">MC</button>
        <button class="science" onclick="factorielle()">x!</button>

        <!-- Ligne -->
        <button class="operateur" onclick="pourcentage()">%</button>
        <button class="operateur" onclick="racine()">√</button>
        <button onclick="ajouter('(')">(</button>
        <button onclick="ajouter(')')">)</button>
        <button class="science" onclick="inverse()">1/x</button>

        <!-- Ligne -->
        <button onclick="ajouter('7')">7</button>
        <button onclick="ajouter('8')">8</button>
        <button onclick="ajouter('9')">9</button>
        <button class="operateur" onclick="ajouter('/')">÷</button>
        <button onclick="ajouter('3.14159265359')">π</button>

        <!-- Ligne -->
        <button onclick="ajouter('4')">4</button>
        <button onclick="ajouter('5')">5</button>
        <button onclick="ajouter('6')">6</button>
        <button class="operateur" onclick="ajouter('*')">×</button>
        <button onclick="ajouter('2.718281828')">e</button>

        <!-- Ligne -->
        <button onclick="ajouter('1')">1</button>
        <button onclick="ajouter('2')">2</button>
        <button onclick="ajouter('3')">3</button>
        <button class="operateur" onclick="ajouter('-')">−</button>
        <button class="science" onclick="cube()">x³</button>

        <!-- Ligne -->
        <button onclick="ajouter('0')">0</button>
        <button onclick="ajouter('.')">.</button>
        <button class="operateur" onclick="ajouter('+')">+</button>
        <button onclick="supprimer()">⌫</button>
        <button class="science" onclick="ajouter('**')">xʸ</button>

        <!-- Bas -->
        <button class="clear" onclick="effacer()">C</button>
        <button class="equal" onclick="calculer()">=</button>

    </div>

    <div class="infos">

        <span>
            Mémoire :
            <span id="memoireValeur">0</span>
        </span>

        <button class="clear" onclick="viderHistorique()">
            Vider historique
        </button>

    </div>

    <div class="historique">

        <h3>Historique intelligent</h3>

        <div id="listeHistorique"></div>

    </div>

</div>

<script>

let ecran = document.getElementById("ecran");

let historique = document.getElementById("listeHistorique");

let memoireTexte = document.getElementById("memoireValeur");

let operateurs = ["+", "-", "*", "/"];

let memoire = 0;

chargerHistorique();

function ajouter(val){

    let dernier = ecran.value.slice(-1);

    if(
        operateurs.includes(dernier) &&
        operateurs.includes(val)
    ){
        return;
    }

    if(val == "."){

        let parties = ecran.value.split(/[\+\-\*\/]/);

        let dernierNombre = parties[parties.length - 1];

        if(dernierNombre.includes(".")){
            return;
        }

    }

    ecran.value += val;

}

function calculer(){

    try{

        if(ecran.value == ""){
            return;
        }

        let expression = ecran.value;

        let resultat = eval(expression);

        if(!isFinite(resultat)){
            throw Error();
        }

        resultat = Number(resultat.toFixed(8));

        ecran.value = resultat;

        ajouterHistorique(expression, resultat);

    }

    catch{

        ecran.value = "Erreur";

    }

}

function ajouterHistorique(expression, resultat){

    let ligne = document.createElement("div");

    ligne.classList.add("ligne");

    let date = new Date();

    let heure =
        date.getHours().toString().padStart(2,"0")
        + ":" +
        date.getMinutes().toString().padStart(2,"0");

    ligne.innerHTML =
        "🕒 " + heure +
        "<br>" +
        expression +
        " = " +
        resultat;

    ligne.onclick = function(){

        ecran.value = resultat;

    };

    historique.prepend(ligne);

    sauvegarderHistorique();

}

function sauvegarderHistorique(){

    localStorage.setItem(
        "historiqueCalculatrice",
        historique.innerHTML
    );

}

function chargerHistorique(){

    let donnees = localStorage.getItem(
        "historiqueCalculatrice"
    );

    if(donnees){

        historique.innerHTML = donnees;

        let lignes =
            historique.querySelectorAll(".ligne");

        lignes.forEach(function(ligne){

            ligne.onclick = function(){

                let texte = ligne.innerText;

                let parties = texte.split("=");

                let resultat =
                    parties[1].trim();

                ecran.value = resultat;

            };

        });

    }

}

function viderHistorique(){

    historique.innerHTML = "";

    localStorage.removeItem(
        "historiqueCalculatrice"
    );

}

function pourcentage(){

    try{

        let valeur = eval(ecran.value);

        let resultat = valeur / 100;

        resultat = Number(resultat.toFixed(8));

        ajouterHistorique(
            valeur + "%",
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function racine(){

    try{

        let valeur = eval(ecran.value);

        if(valeur < 0){
            throw Error();
        }

        let resultat = Math.sqrt(valeur);

        resultat = Number(resultat.toFixed(8));

        ajouterHistorique(
            "√(" + valeur + ")",
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function puissance(){

    try{

        let valeur = eval(ecran.value);

        let resultat = Math.pow(valeur,2);

        ajouterHistorique(
            valeur + "²",
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function cube(){

    try{

        let valeur = eval(ecran.value);

        let resultat = Math.pow(valeur,3);

        ajouterHistorique(
            valeur + "³",
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function inverse(){

    try{

        let valeur = eval(ecran.value);

        if(valeur == 0){
            throw Error();
        }

        let resultat = 1 / valeur;

        resultat = Number(resultat.toFixed(8));

        ajouterHistorique(
            "1/" + valeur,
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function logarithme(){

    try{

        let valeur = eval(ecran.value);

        if(valeur <= 0){
            throw Error();
        }

        let resultat = Math.log10(valeur);

        resultat = Number(resultat.toFixed(8));

        ajouterHistorique(
            "log(" + valeur + ")",
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function sinus(){

    try{

        let valeur = eval(ecran.value);

        let resultat =
            Math.sin(valeur * Math.PI / 180);

        resultat = Number(resultat.toFixed(8));

        ajouterHistorique(
            "sin(" + valeur + ")",
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function cosinus(){

    try{

        let valeur = eval(ecran.value);

        let resultat =
            Math.cos(valeur * Math.PI / 180);

        resultat = Number(resultat.toFixed(8));

        ajouterHistorique(
            "cos(" + valeur + ")",
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function tangente(){

    try{

        let valeur = eval(ecran.value);

        let resultat =
            Math.tan(valeur * Math.PI / 180);

        resultat = Number(resultat.toFixed(8));

        ajouterHistorique(
            "tan(" + valeur + ")",
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function factorielle(){

    try{

        let valeur = eval(ecran.value);

        if(valeur < 0 ||
            !Number.isInteger(valeur)){
            throw Error();
        }

        let resultat = 1;

        for(let i = 1; i <= valeur; i++){

            resultat *= i;

        }

        ajouterHistorique(
            valeur + "!",
            resultat
        );

        ecran.value = resultat;

    }

    catch{

        ecran.value = "Erreur";

    }

}

function memoirePlus(){

    try{

        memoire += eval(ecran.value || 0);

        actualiserMemoire();

    }

    catch{}

}

function memoireMoins(){

    try{

        memoire -= eval(ecran.value || 0);

        actualiserMemoire();

    }

    catch{}

}

function memoireAfficher(){

    ecran.value = memoire;

}

function memoireEffacer(){

    memoire = 0;

    actualiserMemoire();

}

function actualiserMemoire(){

    memoireTexte.innerText = memoire;

}

function effacer(){

    ecran.value = "";

}

function supprimer(){

    ecran.value =
        ecran.value.slice(0, -1);

}

function changerMode(){

    document.body.classList.toggle("clair");

}

document.addEventListener("keydown", function(event){

    let touche = event.key;

    if(
        (touche >= "0" && touche <= "9") ||
        operateurs.includes(touche) ||
        touche == "." ||
        touche == "(" ||
        touche == ")"
    ){

        ajouter(touche);

    }

    else if(touche == "Enter"){

        calculer();

    }

    else if(touche == "Backspace"){

        supprimer();

    }

    else if(touche == "Delete"){

        effacer();

    }

});

</script>

</body>
</html>
